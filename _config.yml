title: Johann Hagerer
description: Sharing concepts and papers about natural language processing, legal reasoning, and data engineering for students and professionals.
author: Johann
url: "https://jhagerer.github.io"

remote_theme: daattali/beautiful-jekyll@6.0.1

navbar-extra:
  - topic-tabs.html

# Rendered as the tab row under the site name.
topic-tabs:
  - All articles: "/"
  - Concepts: "/concepts/"
  - Papers: "/papers/"
  - Student Info: "/student-info/"

navbar-links:
  Topics:
    - Papers I Am Reading: "/papers/"
    - Student Advice: "/student-info/"
    - NLP &amp; Data Concepts: "/concepts/"
  Tags: "tags"

social-network-links:
  github: jhagerer
  rss: true

feed_show_tags: false   # home page shows heading + summary only
feed_show_excerpt: false

date_format: "%b %-d, %Y"   # -> Sep 6, 2025
timezone: "Europe/Berlin"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# --- Colours -------------------------------------------------------------
# These are injected verbatim into the theme's own stylesheet, so pointing
# them at CSS custom properties makes the whole theme palette swappable at
# runtime without overriding any theme file. Values live in
# assets/css/theme-toggle.css.
navbar-col: "var(--bj-navbar)"
navbar-text-col: "var(--bj-navbar-text)"
navbar-border-col: "var(--bj-navbar-border)"
page-col: "var(--bj-page)"
text-col: "var(--bj-text)"
link-col: "var(--bj-link)"
hover-col: "var(--bj-hover)"
footer-col: "var(--bj-footer)"
footer-text-col: "var(--bj-footer-text)"
footer-link-col: "var(--bj-footer-link)"
footer-hover-col: "var(--bj-footer-hover)"

# Light/dark palettes, the toggle button, and the pre-paint theme script.
site-css:
  - "/assets/css/theme-toggle.css"
  - "/assets/css/typography.css"
site-js:
  - "/assets/js/theme-toggle.js"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      head-extra:
        - head-theme-init.html
  - scope:
      path: ""
    values:
      layout: "page"
      head-extra:
        - head-theme-init.html

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
